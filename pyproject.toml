[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csvstat"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
csvstat = "csvstat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["csvstat*"]
